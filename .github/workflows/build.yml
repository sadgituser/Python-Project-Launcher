name: Build App Switcher

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --noconsole --onefile --icon="Assets/photo5.ico" --add-data "Assets;Assets" switcher.py

    - name: Build with PyInstaller (Linux & Mac)
      if: matrix.os != 'windows-latest'
      run: |
        pyinstaller --noconsole --onefile --add-data "Assets:Assets" switcher.py

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: app-switcher-${{ matrix.os }}
        path: dist/
